name: Demo video

# Records the Devpost demo in a real browser on GitHub's servers and publishes the MP4 + key
# screenshots to the `demo-output` branch.
#   With repo secrets PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, GEMINI_API_KEY, SANDBOX_BUYER_EMAIL
#   → real PayPal Sandbox + real Gemini (the version to submit).
#   Without them → mock rehearsal (captions and UI say so; don't submit it).
# Manual start only (or by the secrets watcher), so pushing recorder changes never launches a recording.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: run the walkthrough with test providers. No video is captured, encoded or published."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: demo-video
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The buyer email isn't secret, so a repository *variable* also works for it.
      DEMO_CAPTURE: ${{ inputs.dry_run && 'off' || 'on' }}
      DEMO_MODE: ${{ inputs.dry_run && 'mock' || (secrets.PAYPAL_CLIENT_ID != '' && secrets.PAYPAL_CLIENT_SECRET != '' && secrets.GEMINI_API_KEY != '' && (secrets.SANDBOX_BUYER_EMAIL != '' || vars.SANDBOX_BUYER_EMAIL != '')) && 'sandbox' || 'mock' }}
      PAYPAL_CLIENT_ID: ${{ !inputs.dry_run && secrets.PAYPAL_CLIENT_ID || '' }}
      PAYPAL_CLIENT_SECRET: ${{ !inputs.dry_run && secrets.PAYPAL_CLIENT_SECRET || '' }}
      GEMINI_API_KEY: ${{ !inputs.dry_run && secrets.GEMINI_API_KEY || '' }}
      SANDBOX_BUYER_EMAIL: ${{ !inputs.dry_run && (secrets.SANDBOX_BUYER_EMAIL || vars.SANDBOX_BUYER_EMAIL) || '' }}
      # The model the recording uses. The Gemini key check verifies this same name.
      AI_MODEL: gemini-3.5-flash-lite
    steps:
      - name: Which settings can this run see? (yes/no only, never values)
        run: |
          echo "Repository SECRETS (Settings → Secrets and variables → Actions → Secrets tab):"
          echo "  PAYPAL_CLIENT_ID     ${{ secrets.PAYPAL_CLIENT_ID != '' && 'yes' || 'MISSING' }}"
          echo "  PAYPAL_CLIENT_SECRET ${{ secrets.PAYPAL_CLIENT_SECRET != '' && 'yes' || 'MISSING' }}"
          echo "  GEMINI_API_KEY       ${{ secrets.GEMINI_API_KEY != '' && 'yes' || 'MISSING' }}"
          echo "  SANDBOX_BUYER_EMAIL  ${{ secrets.SANDBOX_BUYER_EMAIL != '' && 'yes' || 'MISSING' }}"
          echo "Repository VARIABLES with the same names (keys must NOT be variables; variables are visible):"
          echo "  PAYPAL_CLIENT_ID     ${{ vars.PAYPAL_CLIENT_ID != '' && 'present' || 'no' }}"
          echo "  PAYPAL_CLIENT_SECRET ${{ vars.PAYPAL_CLIENT_SECRET != '' && 'present' || 'no' }}"
          echo "  GEMINI_API_KEY       ${{ vars.GEMINI_API_KEY != '' && 'present' || 'no' }}"
          echo "  SANDBOX_BUYER_EMAIL  ${{ vars.SANDBOX_BUYER_EMAIL != '' && 'present' || 'no' }}"
          echo "Mode: $DEMO_MODE"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Stop in the first minute, with a clear reason, unless readiness is established. Both checks
      # are read-only (they create nothing, send nothing and print no credentials) and exit non-zero
      # when a key is rejected, the provider can't be reached or times out, the answer is
      # unexpected, or the model isn't available. They don't prove generation or invoicing work.
      - name: PayPal Sandbox key check (read-only, OAuth + Invoicing access)
        if: ${{ env.DEMO_MODE == 'sandbox' }}
        run: node scripts/check-paypal.mjs
      - name: Gemini key check (read-only, key + model availability)
        if: ${{ env.DEMO_MODE == 'sandbox' }}
        run: node scripts/check-gemini.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg
        if: ${{ !inputs.dry_run }}
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Record (${{ env.DEMO_MODE }}, capture ${{ env.DEMO_CAPTURE }})
        run: npx playwright test -c playwright.demo.config.ts
      - name: Encode MP4
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ -f demo-output/frames.json ]; then
            node scripts/encode-demo.mjs demo-output
          else
            echo "Nothing was recorded, so there is nothing to encode."
          fi
      - name: Publish to the demo-output branch
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls demo-output/*.mp4 >/dev/null 2>&1; then
            echo "No video was produced; leaving the demo-output branch as it is."
            exit 0
          fi
          mkdir -p pub && cp -r demo-output/shots pub/ 2>/dev/null || true
          cp demo-output/nexora-demo.mp4 demo-output/nexora-demo-full.mp4 pub/ 2>/dev/null || true
          echo "mode=$DEMO_MODE commit=${GITHUB_SHA::7} run=${GITHUB_RUN_ID} at=$(date -u +%FT%TZ) status=${{ job.status }}" > pub/INFO.txt
          cd pub && git init -q && git checkout -q -b demo-output && git add -A
          git -c user.name="nexora-ci" -c user.email="nexora-ci@users.noreply.github.com" commit -qm "Demo video ($DEMO_MODE) from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-output
