name: Secrets check

# Reports which of the demo recorder's repository secrets this repo's Actions can see.
# yes/no only, values are never printed. Used to start the real Sandbox recording as soon as
# the secrets exist.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report
        run: |
          echo "SECRET PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID != '' && 'yes' || 'no' }}"
          echo "SECRET PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET != '' && 'yes' || 'no' }}"
          echo "SECRET GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY != '' && 'yes' || 'no' }}"
          echo "SECRET SANDBOX_BUYER_EMAIL=${{ (secrets.SANDBOX_BUYER_EMAIL != '' || vars.SANDBOX_BUYER_EMAIL != '') && 'yes' || 'no' }}"
