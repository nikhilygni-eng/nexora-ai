# Render Blueprint (not deployed yet — deployment needs the owner's approval).
# Free plan: the SQLite file lives on ephemeral disk and resets on redeploy/restart.
# For persistence, attach a Render Disk at /var/data and set DATABASE_PATH=/var/data/nexora.db (paid).
services:
  - type: web
    name: nexora-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # FreeLLMAPI runs on localhost, so a hosted demo uses Gemini.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: APP_PASSCODE
        sync: false
      - key: DATABASE_PATH
        value: ./data/nexora.db
